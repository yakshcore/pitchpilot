# Render Blueprint — lets you deploy the brain without filling the form by hand.
# On render.com: New → Blueprint → pick this repo. Render reads this file.
# It auto-generates a secure API_KEY (copy it from the dashboard into n8n).
services:
  - type: web
    name: pitchpilot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: API_KEY
        generateValue: true   # Render creates a strong random key for you
      - key: DAILY_CAP
        value: "30"
